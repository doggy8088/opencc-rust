[package]
name = "opencc-rs-tw2"
version = "0.1.5"
edition = "2024"
description = "Pure Rust port of Will 保哥's C# OpenCC implementation."
license = "MIT"
repository = "https://github.com/doggy8088/opencc-rust"
readme = "README.md"
keywords = ["opencc", "chinese", "conversion", "traditional", "simplified"]
categories = ["text-processing", "internationalization"]

# crates.io 上的 opencc-rust 已被其他專案使用，所以套件名稱是 opencc-rs-tw2，
# 函式庫名稱維持 opencc_rust，使用者的 `use opencc_rust::...` 不用改
[lib]
name = "opencc_rust"

[dependencies]
xmltree = "0.11"
